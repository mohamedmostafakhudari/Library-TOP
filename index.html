		<div class="app">
			<!-- ========== Sidebar ========== -->
			<aside class="sidebar">
				<a
					class="logo"
					href="#shelf"
				>
					<span class="logo-top"
						>My <span class="logo-accent">Book</span></span
					>
					<span class="logo-bottom">Shelf</span>
				</a>

				<nav class="nav">
					<a
						class="nav-link"
						href="#shelf"
					>
						<svg class="icon"><use href="#i-bookshelf" /></svg>
						My Shelf
					</a>
					<a
						class="nav-link"
						href="#add-book"
					>
						<svg class="icon"><use href="#i-gift" /></svg>
						Add A Book
					</a>
				</nav>

				<div class="legal">
					<span>About</span>
					<span>Support</span>
					<span>Terms &amp; Condition</span>
				</div>
			</aside>

			<div class="main">
				<!-- ========== Top bar (decorative) ========== -->
				<header class="topbar">
					<div class="pill search">
						<span class="search-scope">
							All
							<svg class="icon"><use href="#i-caret" /></svg>
						</span>
						<span class="search-text">Search</span>
						<svg class="icon accent"><use href="#i-search" /></svg>
						<span class="divider"></span>
						<svg class="icon accent"><use href="#i-barcode" /></svg>
					</div>

					<div class="pill lang">
						<svg class="icon accent"><use href="#i-translate" /></svg>
						Lang
						<svg class="icon"><use href="#i-caret" /></svg>
					</div>

					<div class="pill datetime">
						<span class="datetime-item">
							<svg class="icon accent"><use href="#i-clock" /></svg>
							09:00 AM
						</span>
						<span class="datetime-item">
							<svg class="icon accent"><use href="#i-calendar" /></svg>
							22-Oct-2026
						</span>
					</div>

					<div class="pill profile">
						<span class="avatar"
							><svg class="icon"><use href="#i-account" /></svg
						></span>
						<span class="profile-name">Kenson</span>
						<svg class="icon profile-caret"><use href="#i-caret" /></svg>
					</div>
				</header>

				<main class="content">
					<!-- ========== View 1: My Shelf ========== -->
					<section
						id="shelf"
						class="view shelf"
					>
						<div
							class="tabs"
							role="radiogroup"
							aria-label="Filter books"
						>
							<label class="tab">
								<input
									type="radio"
									name="filter"
									id="filter-all"
									value="all"
									checked
								/>
								All Books
							</label>
							<label class="tab">
								<input
									type="radio"
									name="filter"
									id="filter-read"
									value="read"
								/>
								Read
							</label>
							<label class="tab">
								<input
									type="radio"
									name="filter"
									id="filter-unread"
									value="unread"
								/>
								Not Read Yet
							</label>
						</div>
						<div
							class="loading-state"
							hidden
						>
							<p role="status">Loading...</p>
						</div>
						<ul
							class="book-grid"
							role="list"
						>
							<!-- dynamically generated book cards  -->
						</ul>
					</section>

					<!-- ========== View 2: Add Book ========== -->
					<section
						id="add-book"
						class="view add-book"
					>
						<form
							class="add-book-form"
							action="#"
							method="post"
							enctype="multipart/form-data"
						>
							<h2 class="form-title">Fill up Book Details</h2>

							<div class="columns">
								<div class="fields">
									<input
										type="text"
										name="title"
										placeholder="Book name"
										aria-label="Book name"
										required
										maxlength="150"
									/>

									<input
										type="text"
										name="authors"
										placeholder="Author name(s), separated by commas"
										aria-label="Author name(s)"
										required
										maxlength="200"
									/>

									<input
										type="number"
										name="pages"
										placeholder="Number of pages"
										aria-label="Number of pages"
										required
										min="1"
										max="10000"
										step="1"
									/>
								</div>

								<div class="side">
									<div class="option">
										<p class="option-title">Reading status</p>
										<label class="check">
											<input
												type="checkbox"
												name="read"
											/>
											<span>I’ve already read this book</span>
										</label>
									</div>

									<div class="option">
										<label
											class="option-title"
											for="cover"
										>
											Book cover <span class="optional">(optional)</span>
										</label>
										<input
											type="file"
											id="cover"
											name="cover"
											accept="image/*"
										/>
										<small class="hint"
											>A placeholder cover is used if you skip this.</small
										>
									</div>
								</div>
							</div>

							<button
								class="btn btn-primary"
								type="submit"
							>
								Submit
							</button>
						</form>
					</section>
				</main>
			</div>
		</div>
	</body>
</html>
